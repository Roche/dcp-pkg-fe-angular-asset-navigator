<div class="dcp-input dcp-autocomplete asset-navigator-combobox">
  <mat-form-field class="asset-navigator-combobox__field" appearance="fill" subscriptSizing="dynamic">
    <mat-label>{{ isDeviceSelection ? getLabel('device') : label }}</mat-label>

    <ng-container *ngIf="isDeviceMode; else singleInput">
      <mat-chip-grid #chipGrid [disabled]="isLoading">
        <mat-chip-row *ngFor="let option of selectedOptions;" (removed)="removeValue(option.value)">
          {{ option.label }}
          <button matChipRemove type="button" [attr.aria-label]="'Remove ' + option.label">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      </mat-chip-grid>
      <input [formControl]="searchControl" 
            [matChipInputFor]="chipGrid" 
            [matAutocomplete]="auto" 
            autocomplete="off" />
    </ng-container>

    <ng-template #singleInput>
      <input matInput
            [formControl]="searchControl"
            [matAutocomplete]="auto"
            autocomplete="off" />
    </ng-template>

    <button *ngIf="showClear; else dropdownIcon"
            matSuffix
            mat-icon-button
            type="button"
            aria-label="Clear"
            (click)="clear($event)">
      <mat-icon>close</mat-icon>
    </button>
    <ng-template #dropdownIcon>
      <mat-icon matSuffix>arrow_drop_down</mat-icon>
    </ng-template>

    <mat-autocomplete #auto="matAutocomplete" 
                      (optionSelected)="onOptionSelected($event)" 
                      (closed)="restoreDisplayText()">
      <mat-option *ngIf="!filteredOptions.length" [disabled]="true">
        No data available
      </mat-option>
      <mat-option *ngFor="let option of filteredOptions;"
                  [value]="option.value"
                  [disabled]="isOptionDisabled(option)"
                  [class.asset-navigator-combobox__option--selected]="isOptionSelected(option)">
        <odcp-level-selector-item [item]="option" [disabled]="isOptionDisabled(option)" />
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</div>
